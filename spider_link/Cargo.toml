[package]
name = "spider_link"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
cs_0_x25519_chacha20 = ["dep:x25519-dalek", "dep:hkdf"]

transport_tcp = []
transport_iroh = ["dep:iroh"]


[dependencies]
link_set = { git = "https://github.com/Ocelmot/link_set", rev = "c995d359ef2fec8073f5fcbd60c5cde7363c70cc", features = [
    "serde",
    "tcp_link",
] }

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.16"
tracing = { version = "0.1", features = ["log"] }

serde = { version = "1.0.132", features = ["derive", "rc"] }
serde_with = "3.7.0"
serde_json = "1.0.73"
serde_cbor = "0.11.2"

base64 = "0.21.0"
sha256 = "1.1.3"
sha2 = "0.10.6"

num-bigint = { version = "0.4.3", features = ["serde"] }
rsa = { version = "0.9.6", features = ["sha2"] }
chacha20poly1305 = "0.10.0"
rand = "0.8.5"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
network-interface = "2.0.0"
futures = "0.3.31"
auto-const-array = "0.2.2"


# crypto schemes
# cs_0_x25519_chacha20
x25519-dalek = { "version" = "2.0.1", optional = true, features = [
    "static_secrets",
] }
hkdf = { "version" = "0.12.4", optional = true }


# Transport mechanisms
# transport_iroh
iroh = { version = "1.0.1", optional = true, features = [] }

[dev-dependencies]
tracing-test = "0.2.5"
link_set = { git = "https://github.com/Ocelmot/link_set", rev = "c995d359ef2fec8073f5fcbd60c5cde7363c70cc", features = [
    "pipe_link",
] }
