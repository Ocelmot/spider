[package]
name = "spider"
version = "0.1.0"
edition = "2021"
default-run = "spider"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["default_transports"]
default_transports = ["transport_tcp", "transport_iroh"]
transport_tcp = ["spider_link/transport_tcp"]
transport_iroh = ["spider_link/transport_iroh"]

[dependencies]
dht_chord = { git = "https://github.com/Ocelmot/chord_dht", rev = "3c3cbb88042d5e2c3c3f27aa96a596b7222433c9" }
spider_link = { path = "../spider_link", features = ["cs_0_x25519_chacha20"] }

tokio = { version = "1", features = ["full"] }
console-subscriber = "0.4.1"

network-interface = "2.0.0"

toml = "0.8.19"
serde_json = "1.0.73"
serde = { version = "1.0.132", features = ["derive"] }
serde_with = {version = "3.7.0", features = ["base64"]}


tracing = "0.1"
tracing-subscriber = {version = "0.3.14", features = ["env-filter"]}
tracing-appender = "0.2.2"

rsa = "0.9.6"
sha256 = "1.1.3"

lru = "0.12.5"
phf = { version = "0.11", features = ["macros"] }
rand = "0.8.5"

regex = "1.8.1"

num-bigint = { version = "0.4.3", features = ["serde"] }
bimap = "0.6.3"
simple_logger = "5.0.0"
